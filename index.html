<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cotação do Dólar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💵 Cotação do Dólar</h1>

        <p class="subtitulo">Cotação USD/BRL em tempo real</p>

        <div class="cards">

            <div class="card">
                <h2>Valor atual</h2>
                <p id="valorAtual">Carregando...</p>
            </div>

            <div class="card">
                <h2>Maior valor do dia</h2>
                <p id="maiorValor">Carregando...</p>
            </div>

            <div class="card">
                <h2>Menor valor do dia</h2>
                <p id="menorValor">Carregando...</p>
            </div>

        </div>

        <p id="ultimaAtualizacao">
            Atualizando...
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
